<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI日報</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #f0f4f8; color: #333; -webkit-tap-highlight-color: transparent; }
        .container { max-width: 600px; margin: auto; padding: 15px; }
        
        /* ヘッダー周り：林業っぽい緑に */
        header { background: #2E7D32; color: white; padding: 15px; text-align: center; border-radius: 0 0 15px 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        h1 { margin: 0; font-size: 1.2rem; }
        .sub-text { font-size: 0.8rem; opacity: 0.9; margin-top: 5px; }

        /* ステータス表示 */
        .status-box { background: white; padding: 15px; border-radius: 12px; margin-top: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }
        .status-text { font-size: 1.2rem; font-weight: bold; color: #666; }
        .coord-text { font-family: monospace; font-size: 0.9rem; color: #555; margin-top: 5px; }
        
        /* メインボタン */
        .btn-main { width: 100%; padding: 20px; border: none; border-radius: 50px; font-weight: bold; font-size: 1.2rem; margin-top: 20px; cursor: pointer; transition: transform 0.1s, box-shadow 0.2s; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .btn-main:active { transform: scale(0.98); }
        
        .btn-start { background: linear-gradient(135deg, #2E7D32, #1B5E20); }
        .btn-stop { background: linear-gradient(135deg, #d32f2f, #b71c1c); display: none; animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(211, 47, 47, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(211, 47, 47, 0); }
            100% { box-shadow: 0 0 0 0 rgba(211, 47, 47, 0); }
        }

        /* サブ機能エリア */
        .tools-area { margin-top: 30px; display: grid; gap: 10px; }
        .btn-tool { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; font-size: 0.9rem; }
        .btn-csv { background: #0277BD; } /* 青 */
        .btn-map { background: #F9A825; color: #333; } /* 黄色 */
        .btn-clear { background: white; border: 1px solid #d32f2f; color: #d32f2f; margin-top: 20px; }

        /* 地図 */
        #map { height: 300px; width: 100%; border-radius: 12px; margin-top: 15px; display: none; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        
        /* データ数表示 */
        .count-badge { background: #eee; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; color: #555; }
    </style>
</head>
<body>

<header>
    <h1>AI日報<span style="font-size:0.8em">v0.1.1</span></h1>
    <div class="sub-text">GPSログ自動記録ツール</div>
</header>

<div class="container">
    <div class="status-box">
        <div id="status" class="status-text">待機中</div>
        <div id="coords" class="coord-text">---, ---</div>
        <div style="margin-top:10px;"><span class="count-badge">記録件数: <span id="dataCount">0</span>件</span></div>
    </div>

    <button id="btnStart" class="btn-main btn-start">記録開始 (Start)</button>
    <button id="btnStop" class="btn-main btn-stop">記録終了 (Stop)</button>

    <div class="tools-area">
        <button id="btnCsv" class="btn-tool btn-csv">📊 CSV出力 (AI解析用)</button>
        <button id="btnMap" class="btn-tool btn-map">🗺️ 現在地・ルート確認</button>
        
        <div id="map"></div>
        
        <button id="btnClear" class="btn-tool btn-clear">データ全消去</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // --- 定数設定 ---
    const GPS_INTERVAL = 30000; // 30秒間隔 (バッテリーと精度のバランス)
    const STORAGE_KEY = 'aiNippoDataV1';

    // --- 変数 ---
    let trackingIntervalId = null;
    let isTracking = false;
    let map = null;
    let mapLayerGroup = null;

    // --- PWA更新検知 ---
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                reg.onupdatefound = () => {
                    const installingWorker = reg.installing;
                    installingWorker.onstatechange = () => {
                        if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            if (confirm("新しいバージョンがあります。更新しますか？")) {
                                if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                                window.location.reload();
                            }
                        }
                    };
                };
            });
        });
        navigator.serviceWorker.addEventListener('controllerchange', () => window.location.reload());
    }

    // --- 初期表示更新 ---
    updateCount();

    // --- ボタン操作 ---
    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');
    const statusDiv = document.getElementById('status');

    btnStart.addEventListener('click', () => {
        if(!confirm("30秒間隔でGPS記録を開始します。\n現場作業を開始しますか？")) return;
        startTracking();
    });

    btnStop.addEventListener('click', () => {
        if(!confirm("記録を終了しますか？")) return;
        stopTracking();
    });

    function startTracking() {
        isTracking = true;
        btnStart.style.display = 'none';
        btnStop.style.display = 'block';
        statusDiv.innerText = "記録中...";
        statusDiv.style.color = "#2E7D32";
        
        // 初回即時
        getLocationAndSave();
        // 定期実行
        trackingIntervalId = setInterval(getLocationAndSave, GPS_INTERVAL);
    }

    function stopTracking() {
        isTracking = false;
        clearInterval(trackingIntervalId);
        btnStart.style.display = 'block';
        btnStop.style.display = 'none';
        statusDiv.innerText = "待機中";
        statusDiv.style.color = "#666";
        document.getElementById('coords').innerText = "---, ---";
    }

    // --- GPS取得と保存 ---
    function getLocationAndSave() {
        if(!isTracking) return;

        navigator.geolocation.getCurrentPosition(
            pos => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                const now = new Date();
                
                // 画面更新
                statusDiv.innerText = "記録中 (" + now.toLocaleTimeString() + ")";
                document.getElementById('coords').innerText = lat.toFixed(5) + ", " + lon.toFixed(5);

                // 保存用データ作成 (Colabで扱いやすい形式)
                const record = {
                    time: formatTimestamp(now), // YYYY-MM-DD HH:MM:SS
                    lat: lat,
                    lon: lon
                };

                // 保存
                saveData(record);
            },
            err => {
                console.error(err);
                statusDiv.innerText = "GPS測位失敗 (リトライ中)";
            },
            { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
        );
    }

    function formatTimestamp(date) {
        const y = date.getFullYear();
        const m = ('0' + (date.getMonth() + 1)).slice(-2);
        const d = ('0' + date.getDate()).slice(-2);
        const H = ('0' + date.getHours()).slice(-2);
        const M = ('0' + date.getMinutes()).slice(-2);
        const S = ('0' + date.getSeconds()).slice(-2);
        return `${y}-${m}-${d} ${H}:${M}:${S}`;
    }

    function saveData(record) {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        data.push(record);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        updateCount();
        
        // 地図が開いていれば更新
        if(document.getElementById('map').style.display === 'block') {
            updateMap(record);
        }
    }

    function updateCount() {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        document.getElementById('dataCount').innerText = data.length;
    }

    // --- CSV出力 (最重要機能) ---
    document.getElementById('btnCsv').addEventListener('click', () => {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        if (data.length === 0) return alert("データがありません");

        // CSVヘッダーとデータ
        let csvContent = "time,lat,lon\n";
        data.forEach(row => {
            csvContent += `${row.time},${row.lat},${row.lon}\n`;
        });

        // ファイル名生成 (変更箇所: AI日報-yyyyMMdd-HHmm.csv)
        const now = new Date();
        const y = now.getFullYear();
        const m = ('0' + (now.getMonth() + 1)).slice(-2);
        const d = ('0' + now.getDate()).slice(-2);
        const H = ('0' + now.getHours()).slice(-2);
        const M = ('0' + now.getMinutes()).slice(-2);

        const fileName = `AI日報-${y}${m}${d}-${H}${M}.csv`;

        // ダウンロード処理
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        if (link.download !== undefined) {
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", fileName);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    });

    // --- データの消去 ---
    document.getElementById('btnClear').addEventListener('click', () => {
        if(confirm("全てのログデータを削除します。本当によろしいですか？")) {
            localStorage.removeItem(STORAGE_KEY);
            updateCount();
            if(mapLayerGroup) mapLayerGroup.clearLayers();
            alert("データを削除しました");
        }
    });

    // --- 地図機能 (簡易確認用) ---
    document.getElementById('btnMap').addEventListener('click', () => {
        const mapDiv = document.getElementById('map');
        if (mapDiv.style.display === 'block') {
            mapDiv.style.display = 'none';
        } else {
            mapDiv.style.display = 'block';
            initMap();
        }
    });

    function initMap() {
        if (!map) {
            map = L.map('map').setView([36.06, 136.22], 13); // 福井付近初期値
            L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
                attribution: "&copy; GSI"
            }).addTo(map);
            mapLayerGroup = L.layerGroup().addTo(map);
        }
        
        // 全データを描画
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        mapLayerGroup.clearLayers();
        
        if (data.length > 0) {
            const latlngs = data.map(d => [d.lat, d.lon]);
            // 軌跡の線
            L.polyline(latlngs, {color: '#2E7D32', weight: 4}).addTo(mapLayerGroup);
            // 現在地の丸
            const last = data[data.length - 1];
            L.circleMarker([last.lat, last.lon], {color: 'red', radius: 6}).addTo(mapLayerGroup);
            map.fitBounds(latlngs);
        }
        setTimeout(() => map.invalidateSize(), 200);
    }

    function updateMap(record) {
        if(map && mapLayerGroup) {
            L.circleMarker([record.lat, record.lon], {color: '#2E7D32', radius: 2}).addTo(mapLayerGroup);
            map.setView([record.lat, record.lon]);
        }
    }
</script>

</body>
</html>
